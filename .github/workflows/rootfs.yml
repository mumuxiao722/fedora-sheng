name: Build Fedora RootFS

on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora Version'
        type: choice
        options:
          - 43
          - 44
          - 45
          - rawhide
        default: '44'

      enable_third_party:
        description: 'Enable third-party repositories'
        type: boolean
        default: false

      desktop:
        description: 'Desktop Environment (server = no DE). Denial is built from source for ARM64: a first run with no cache builds the whole Flutter engine + Denial and can take 3+ hours (cached afterwards). Denial ships no terminal by default - add one via extra_packages'
        type: choice
        options:
          - 'GNOME'
          - 'KDE Plasma'
          - 'Denial'
          - 'server'
        default: 'GNOME'

      gnome_mobile:
        description: 'Enable GNOME Mobile from @mobility/gnome-mobile COPR (requires Enable Third-Party). Check https://copr.fedorainfracloud.org/coprs/g/mobility/gnome-mobile/monitor/ for build status.'
        type: boolean
        default: false

      plasma_mobile:
        description: 'Enable Plasma Mobile instead of Plasma Desktop (only when desktop=KDE Plasma). WARNING: Only Fedora 43 is confirmed working. Plasma Mobile crashes on fc44/45/rawhide.'
        type: boolean
        default: false

      denial_mobile:
        description: 'Denial: launch in Mobile mode (Android-like tablet UI) instead of Desktop mode (no on-screen keyboard) (only when desktop=Denial).'
        type: boolean
        default: true

      autologin:
        description: 'Autologin'
        type: boolean
        default: true

      username:
        description: 'Username'
        type: string
        default: 'username'

      hostname:
        description: 'Hostname'
        type: string
        default: 'fedora-sheng'

      language:
        description: 'System language'
        type: choice
        options:
          - 'None (C.UTF-8)'
          - 'en_US.UTF-8'
          - 'zh_CN.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
        default: 'None (C.UTF-8)'

      extra_packages:
        description: 'Extra packages to install (space-separated)'
        type: string
        required: false
        default: ''

      boot_mode:
        description: |
          Boot mode:
          - single: Boot from partition "userdata"
          - dual: Boot from partition "linux"
          - custom: Boot from custom partition
        type: choice
        options:
          - 'single (userdata)'
          - 'dual (linux)'
          - 'custom'
        default: 'dual (linux)'

      custom_partition:
        description: 'Custom partition (required when boot_mode=custom)'
        type: string
        required: false
        default: ''

      quiet_boot:
        description: 'Enable Plymouth splash and quiet boot'
        type: boolean
        default: true

      plymouth_theme:
        description: 'Plymouth theme (requires quiet_boot=true). Default = spinner for GNOME, breeze for KDE'
        type: choice
        options:
          - 'default'
          - 'none'
          - 'plymouth-theme-charge'
          - 'plymouth-theme-breeze'
          - 'plymouth-theme-spinner'
          - 'plymouth-theme-spinfinity'
          - 'plymouth-theme-solar'
          - 'plymouth-theme-fade-in'
        default: 'default'

      kernel_source:
        description: |
          Kernel Source:
          - prebuilt: Use prebuilt kernel RPM
          - custom_build: Build from source
        type: choice
        options:
          - 'prebuilt'
          - 'custom_build'
        default: 'prebuilt'

      kernel_prebuilt:
        description: 'Prebuilt kernel source (only when kernel_source=prebuilt)'
        type: choice
        options:
          - 'upstream'
          - 'own'
        default: 'upstream'

      kernel_repo:
        description: 'Kernel Repo URL (only when kernel_source=custom_build)'
        type: string
        required: false
        default: 'https://github.com/ianchb/sm8550-mainline'

      kernel_branch:
        description: 'Kernel branch name or release tag (custom_build: upstream branch, prebuilt: release tag)'
        type: string
        required: false
        default: 'sheng-7.2.2'

      kernel_config:
        description: 'Kernel Config file path in repo (only when kernel_source=custom_build)'
        type: string
        required: false
        default: 'sm8550.config'

      firmware_repo:
        description: 'Firmware Repo URL'
        type: string
        required: false
        default: 'https://github.com/ianchb/sheng-firmware'

      firmware_branch:
        description: 'Firmware Branch'
        type: string
        required: false
        default: 'master'

jobs:
  # ==========================================================================
  # Build Kernel
  # ==========================================================================
  build-kernel:
    name: "Build Custom Kernel"
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.kernel_source == 'custom_build' }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,pch_defines,include_file_mtime

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc \
            cpio kmod libncurses-dev rpm \
            clang llvm lld ccache
          echo "✓ Build tools installed"

      - name: "Restore ccache"
        id: kernel-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: "Reset ccache stats"
        run: ccache -z

      - name: "Clone Kernel Source"
        run: |
          git clone "${{ inputs.kernel_repo }}" \
            --branch "${{ inputs.kernel_branch }}" \
            --depth 1 \
            linux
          echo "✓ Kernel source cloned"

      - name: "Build Kernel"
        id: build
        run: |
          cd linux
          cp "${{ github.workspace }}/${{ inputs.kernel_config }}" .config

          export CC="ccache clang"
          export CXX="ccache clang++"

          make -j$(nproc) ARCH=arm64 LLVM=1

          KVER="$(make kernelrelease -s)"
          echo "kernel_version=$KVER" >> $GITHUB_OUTPUT
          echo "  Kernel version: $KVER"

          make -j$(nproc) ARCH=arm64 LLVM=1 \
            INSTALL_MOD_PATH="${{ github.workspace }}/kernel-staging" \
            modules_install

          echo "✓ Kernel build complete"

          mkdir -p "${{ github.workspace }}/kernel-staging/boot"
          install -Dm644 arch/arm64/boot/Image.gz \
            "${{ github.workspace }}/kernel-staging/boot/Image.gz"
          install -Dm644 arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            "${{ github.workspace }}/kernel-staging/boot/sm8550-xiaomi-sheng.dtb"
          install -Dm644 .config \
            "${{ github.workspace }}/kernel-staging/boot/config-${KVER}"

          cd "${{ github.workspace }}"
          cat linux/arch/arm64/boot/Image.gz \
              linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            > Image.gz-dtb_sheng
          cp Image.gz-dtb_sheng "${{ github.workspace }}/kernel-staging/boot/"

      - name: "Package Kernel RPM"
        run: |
          KREL="${{ inputs.kernel_branch }}"
          KREL="${KREL#*-}"
          TOPDIR="${{ github.workspace }}/rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cp rpms/kernel-sheng.spec "$TOPDIR/SPECS/kernel-sheng.spec"

          cd "${{ github.workspace }}/kernel-staging"
          mkdir -p "kernel-sheng-${KREL}"
          mv boot lib "kernel-sheng-${KREL}/"
          tar -czf "$TOPDIR/SOURCES/kernel-sheng-${KREL}.tar.gz" "kernel-sheng-${KREL}"

          cd "$TOPDIR"
          rpmbuild --define "_topdir $TOPDIR" \
                   --define "_kernel_version ${KREL}" \
                   --define "_kernel_repo ${{ inputs.kernel_repo }}" \
                   --define "_kernel_config ${{ github.workspace }}/${{ inputs.kernel_config }}" \
                   --nodeps -ba SPECS/kernel-sheng.spec
          echo "✓ Kernel RPM packaged (${KREL})"
          ls -la RPMS/aarch64/

      - name: "Upload Kernel Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: kernel-sheng
          path: rpmbuild/RPMS/aarch64/kernel-sheng-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Save ccache"
        if: ${{ always() && steps.kernel-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.kernel-cache-restore.outputs.cache-primary-key }}

  # ==========================================================================
  # Build Custom RPMs (in Fedora container)
  # ==========================================================================
  build-rpms:
    name: "Build Custom RPMs"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Build RPMs in Fedora Container"
        run: |
          FEDORA_VERSION=${{ inputs.fedora_version }}
          if [ "$FEDORA_VERSION" = "rawhide" ]; then
            RPM_SUFFIX="fc46"
          else
            RPM_SUFFIX="fc${FEDORA_VERSION}"
          fi
          echo "RPM_SUFFIX=${RPM_SUFFIX}" >> $GITHUB_ENV

          podman pull registry.fedoraproject.org/fedora:${FEDORA_VERSION}

          podman run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e FIRMWARE_REPO="${{ inputs.firmware_repo }}" \
            -e FIRMWARE_BRANCH="${{ inputs.firmware_branch }}" \
            registry.fedoraproject.org/fedora:${FEDORA_VERSION} \
            bash /workspace/.github/build-rpms.sh "${FEDORA_VERSION}"

      - name: "Clean debuginfo/devel RPMs"
        run: find rpmbuild/RPMS -name "*-debuginfo-*" -o -name "*-devel-*" | xargs rm -f

      - name: "Upload libssc RPM"
        uses: actions/upload-artifact@v7
        with:
          name: libssc-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/libssc-[0-9]*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload fastrpc RPM"
        uses: actions/upload-artifact@v7
        with:
          name: fastrpc-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/fastrpc-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-sheng-thp RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-thp-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/xiaomi-sheng-thp-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-sheng-keyboard-helper RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-keyboard-helper-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/xiaomi-sheng-keyboard-helper-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload iio-sensor-proxy RPM"
        uses: actions/upload-artifact@v7
        with:
          name: iio-sensor-proxy-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/iio-sensor-proxy-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload firmware-xiaomi-sheng RPM"
        uses: actions/upload-artifact@v7
        with:
          name: firmware-xiaomi-sheng-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/firmware-xiaomi-sheng-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload sheng-audio-fix RPM"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-audio-fix-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/sheng-audio-fix-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload sheng-devauth RPM"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-devauth-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/sheng-devauth-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-mipps-auth RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-mipps-auth-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/xiaomi-mipps-auth-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-charger-mode RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-charger-mode-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/xiaomi-charger-mode-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-sheng-keyboard-backlight RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-keyboard-backlight-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/xiaomi-sheng-keyboard-backlight-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload sheng-sensors RPM"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-sensors-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/sheng-sensors-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload alsa-xiaomi-sheng RPM"
        uses: actions/upload-artifact@v7
        with:
          name: alsa-xiaomi-sheng-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/noarch/alsa-xiaomi-sheng-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-pen-status RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-pen-status-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/xiaomi-pen-status-*.rpm
          retention-days: 3
          if-no-files-found: warn

      - name: "Upload xiaomi-sheng-fingerprint RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-fingerprint-rpm-${{ env.RPM_SUFFIX }}
          path: rpmbuild/RPMS/aarch64/xiaomi-sheng-fingerprint-*.rpm
          retention-days: 3
          if-no-files-found: warn

  # ==========================================================================
  # Build Denial (source build, ARM64; see docs/BUILDING.md)
  # ==========================================================================
  build-denial:
    name: "Build Denial (v0.3.1, ARM64)"
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.desktop == 'Denial' }}

    env:
      DENIAL_PC_DEPENDENCY_ROOT: ${{ github.workspace }}/.denial-cache/deps
      DENIAL_PC_BUILD_ROOT: ${{ github.workspace }}/.denial-cache/pc-build
      DENIAL_FLUTTER_ENGINE_CACHE_ROOT: ${{ github.workspace }}/.denial-cache/engine
      DENIAL_FLUTTER_ENGINE_JOBS: 2

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Checkout Denial (tag v0.3.1)"
        uses: actions/checkout@v7
        with:
          repository: denialwm/denial
          ref: v0.3.1
          path: denial
          fetch-depth: 0
          fetch-tags: true

      - name: "Restore Denial engine cache"
        id: denial-cache-restore
        uses: actions/cache/restore@v5
        with:
          # Keep this small (validated engine artifacts + state). The full
          # .denial-cache (synchronized Flutter/Skia checkout + 3-mode build
          # trees) blows past GitHub's per-cache limit and never saves, which
          # silently caused a full ~2.5h engine rebuild on every run.
          path: |
            ${{ github.workspace }}/.denial-cache/engine/artifacts
            ${{ github.workspace }}/.denial-cache/engine/state
          key: denial-engine-cache-v0.3.1
          restore-keys: |
            denial-engine-cache-

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl tar xz-utils zip unzip \
            build-essential cmake ninja-build pkg-config \
            clang llvm libclang-dev \
            rustup \
            libglvnd-dev libegl1-mesa-dev mesa-common-dev \
            libdrm-dev libgbm-dev libgles-dev libsdl2-dev \
            libinput-dev libudev-dev libxkbcommon-dev libseat-dev \
            libglib2.0-dev libgtk-3-dev fontconfig \
            rpm rpm2cpio libarchive-tools

      - name: "Add Rust toolchain"
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: "Patch Denial tooling for ARM64"
        run: bash .github/denial-arm64/patch-denial-arm64.sh denial

      - name: "Denial doctor (host prerequisite check)"
        run: ./tools/denial-pc doctor || true
        working-directory: denial

      - name: "Bootstrap Denial tooling"
        run: ./tools/denial-pc bootstrap
        working-directory: denial

      - name: "Inspect Denial engine cache"
        run: |
          if [[ -d .denial-cache/engine/artifacts ]]; then
            echo "engine artifacts cache restored:"
            du -sh .denial-cache/engine/artifacts
            find .denial-cache/engine/artifacts -maxdepth 2 -type f | head -20
          else
            echo "engine artifacts cache MISSED (full ~2.5h rebuild expected)"
          fi
          if [[ -f .denial-cache/engine/state/source-lock.sha256 ]]; then
            echo "engine state cache restored"
          fi

      - name: "Build Flutter engine (cacheable)"
        run: ./tools/denial-flutter-engine build
        working-directory: denial

      - name: "Build Denial"
        run: ./tools/denial-pc build
        working-directory: denial

      - name: "Set RPM Suffix"
        run: |
          FEDORA_VERSION=${{ inputs.fedora_version }}
          if [ "$FEDORA_VERSION" = "rawhide" ]; then
            RPM_SUFFIX="fc46"
          else
            RPM_SUFFIX="fc${FEDORA_VERSION}"
          fi
          echo "RPM_SUFFIX=${RPM_SUFFIX}" >> $GITHUB_ENV

      - name: "Package RPMs"
        run: ./tools/denial-pc fedora-package
        working-directory: denial

      - name: "Upload Denial RPM"
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-${{ env.RPM_SUFFIX }}
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-[0-9]*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload Denial Flutter Engine RPM"
        uses: actions/upload-artifact@v7
        with:
          name: denial-flutter-engine-rpm-${{ env.RPM_SUFFIX }}
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-flutter-engine-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Inspect Denial engine cache before save"
        if: ${{ always() && steps.denial-cache-restore.outputs.cache-hit != 'true' }}
        run: |
          echo "Cache key: ${{ steps.denial-cache-restore.outputs.cache-primary-key }}"
          echo "Cache hit on restore: ${{ steps.denial-cache-restore.outputs.cache-hit }}"
          for dir in .denial-cache/engine/artifacts .denial-cache/engine/state; do
            if [[ -d "$dir" ]]; then
              echo "  $dir:"
              du -sh "$dir"
              find "$dir" -maxdepth 3 -type f | head -20
            else
              echo "  $dir: MISSING"
            fi
          done

      - name: "Save Denial engine cache"
        if: ${{ always() && steps.denial-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.denial-cache/engine/artifacts
            ${{ github.workspace }}/.denial-cache/engine/state
          key: ${{ steps.denial-cache-restore.outputs.cache-primary-key }}

  # ==========================================================================
  # Build RootFS
  # ==========================================================================
  build-rootfs:
    name: "Build Fedora RootFS"
    runs-on: ubuntu-24.04-arm
    needs: [build-rpms, build-kernel, build-denial]
    if: ${{ !cancelled() && needs.build-rpms.result == 'success' && (needs.build-kernel.result == 'success' || needs.build-kernel.result == 'skipped') && (needs.build-denial.result == 'success' || needs.build-denial.result == 'skipped') }}

    env:
      ROOTFS_MOUNT: /mnt/rootfs
      IMAGE_SIZE: 10G

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y tar xz-utils e2fsprogs dnf
          echo "✓ Build tools installed"

      - name: "Download RPM Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: rpms/
          merge-multiple: true

      - name: "Download sheng-tablet-mode RPM (GNOME Auto-Rotation & Lid Detection)"
        if: ${{ inputs.desktop == 'GNOME' }}
        run: |
          gh release download \
            --repo mumuxiao722/sheng-tablet-mode \
            --pattern 'sheng-tablet-mode-*.noarch.rpm' \
            --dir rpms/ \
            --clobber
          echo "✓ sheng-tablet-mode RPM downloaded from sheng-tablet-mode Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download Kernel Artifact (custom_build)"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/download-artifact@v8
        with:
          name: kernel-sheng
          path: rpms/

      - name: "Download Kernel RPM (prebuilt upstream)"
        if: ${{ inputs.kernel_source == 'prebuilt' && inputs.kernel_prebuilt == 'upstream' }}
        run: |
          gh release download "${{ inputs.kernel_branch }}" \
            --repo mumuxiao722/fedora-sheng \
            --pattern "kernel-sheng.zip" \
            --dir rpms/ \
            --clobber
          cd rpms && unzip -o kernel-sheng.zip && cd ..
          echo "✓ Kernel RPM downloaded from upstream (${{ inputs.kernel_branch }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download Kernel RPM (prebuilt own)"
        if: ${{ inputs.kernel_source == 'prebuilt' && inputs.kernel_prebuilt == 'own' }}
        run: |
          gh release download "${{ inputs.kernel_branch }}" \
            --repo "${{ github.repository }}" \
            --pattern "kernel-sheng.zip" \
            --dir rpms/ \
            --clobber
          cd rpms && unzip -o kernel-sheng.zip && cd ..
          echo "✓ Kernel RPM downloaded from own release (${{ inputs.kernel_branch }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Parse Partition Label"
        id: partition
        run: |
          case "${{ inputs.boot_mode }}" in
            'single (userdata)')
              echo "label=userdata" >> $GITHUB_OUTPUT
              ;;
            'dual (linux)')
              echo "label=linux" >> $GITHUB_OUTPUT
              ;;
            'custom')
              echo "label=${{ inputs.custom_partition }}" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "✓ Partition label set"

      - name: "Parse DE Name"
        id: de
        run: |
          case "${{ inputs.desktop }}" in
            'GNOME')
              if [ "${{ inputs.gnome_mobile }}" = "true" ]; then
                echo "name=gnome-mobile" >> $GITHUB_OUTPUT
              else
                echo "name=gnome" >> $GITHUB_OUTPUT
              fi
              ;;
            'KDE Plasma')
              if [ "${{ inputs.plasma_mobile }}" = "true" ]; then
                echo "name=kde-mobile" >> $GITHUB_OUTPUT
              else
                echo "name=kde" >> $GITHUB_OUTPUT
              fi
              ;;
            'Denial')
              echo "name=denial" >> $GITHUB_OUTPUT
              ;;
            'server')
              echo "name=server" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "✓ DE name set"

      - name: "Parse Kernel Source"
        id: kernel
        run: |
          if [[ "${{ inputs.kernel_source }}" == "custom_build" ]]; then
            echo "name=custom" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.kernel_prebuilt }}" == "upstream" ]]; then
            echo "name=upstream" >> $GITHUB_OUTPUT
          else
            echo "name=own" >> $GITHUB_OUTPUT
          fi
          echo "✓ Kernel source name set"

      - name: "Verify Arguments"
        run: |
          if [ "${{ inputs.boot_mode }}" = "custom" ] && [ "${{ inputs.kernel_source }}" != "custom_build" ]; then
            echo "::error::Custom boot mode requires kernel_source=custom_build"
            exit 1
          fi
          if [ "${{ inputs.boot_mode }}" = "custom" ] && [ -z "${{ inputs.custom_partition }}" ]; then
            echo "::error::Custom boot mode requires custom_partition to be set"
            exit 1
          fi
          echo "✓ Arguments verified"

      - name: "Create RootFS Image"
        run: |
          truncate -s "$IMAGE_SIZE" rootfs.img
          mkfs.ext4 rootfs.img
          echo "✓ RootFS image created (${IMAGE_SIZE})"

      - name: "Mount RootFS Image"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT"
          sudo mount -o loop rootfs.img "$ROOTFS_MOUNT"
          echo "✓ RootFS image mounted at $ROOTFS_MOUNT"

      - name: "Install Fedora via DNF"
        run: |
          FEDORA_VERSION=${{ inputs.fedora_version }}
          sudo podman run --rm \
            -v "/mnt/rootfs:/mnt/rootfs" \
            registry.fedoraproject.org/fedora:${FEDORA_VERSION} \
            dnf \
              --installroot=/mnt/rootfs \
              --releasever=${FEDORA_VERSION} \
              --use-host-config \
              --setopt=install_weak_deps=False \
              --setopt=tsflags=nodocs \
              install -y \
              @core \
              systemd systemd-sysv \
              sudo curl \
              NetworkManager NetworkManager-wifi NetworkManager-tui \
              openssh-server \
              wpa_supplicant dbus \
              ca-certificates \
              iw \
              lm_sensors \
              wireless-regdb \
              glib2 \
              libqmi \
              libmbim \
              polkit \
              cracklib-dicts
          echo "✓ DNF installroot complete"

      - name: "Mount Virtual File Systems"
        run: |
          sudo mount --bind /dev "$ROOTFS_MOUNT/dev"
          sudo mount --bind /dev/pts "$ROOTFS_MOUNT/dev/pts"
          sudo mount -t proc proc "$ROOTFS_MOUNT/proc"
          sudo mount -t sysfs sys "$ROOTFS_MOUNT/sys"
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf"
          sudo cp /etc/resolv.conf "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ Virtual file systems mounted"

      - name: "Install Custom RPMs"
        run: |
          # xiaomi-sheng + table-mode (GNOME, from sheng-tablet-mode Release) + denial
          # (built by build-denial when desktop=Denial), all merged into rpms/.
          cp rpms/*.rpm "$ROOTFS_MOUNT/tmp/"
          sudo chroot "$ROOTFS_MOUNT" bash -c "dnf install -y /tmp/*.rpm"
          sudo rm -f "$ROOTFS_MOUNT/tmp/"*.rpm
          echo "✓ Custom RPMs installed"

      - name: "Versionlock iio-sensor-proxy"
        run: |
          # Lock iio-sensor-proxy to prevent Fedora repo updates from overwriting our custom build
          sudo chroot "$ROOTFS_MOUNT" dnf install -y python3-dnf-plugin-versionlock
          sudo chroot "$ROOTFS_MOUNT" dnf versionlock add iio-sensor-proxy
          echo "✓ iio-sensor-proxy versionlocked"

      - name: "Install Extra Packages"
        if: ${{ inputs.extra_packages != '' }}
        run: |
          EXTRA_PKGS="${{ inputs.extra_packages }}"
          echo "  Extra packages: $EXTRA_PKGS"
          sudo chroot "$ROOTFS_MOUNT" dnf install -y $EXTRA_PKGS
          echo "✓ Extra packages installed"

      - name: "Compute Effective quiet_boot"
        id: quiet
        run: |
          if [[ "${{ inputs.quiet_boot }}" == "true" && "${{ inputs.desktop }}" != "server" ]]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: "Enable Third-Party Repositories"
        if: ${{ inputs.enable_third_party == true }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y dnf-plugins-core
          echo "✓ Third-party repository support enabled"

      - name: "Install GNOME"
        if: ${{ inputs.desktop == 'GNOME' && inputs.gnome_mobile == false }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y \
            pipewire-pulseaudio pipewire-alsa pipewire-jack-audio-connection-kit \
            gnome-shell gnome-session gnome-terminal \
            gdm gnome-control-center systemd-pam \
            xdg-desktop-portal-gnome xdg-desktop-portal-gtk \
            xorg-x11-server-Xwayland \
            nautilus gvfs-mtp
          echo "✓ GNOME installed"

      - name: "Install GNOME Mobile"
        if: ${{ inputs.desktop == 'GNOME' && inputs.gnome_mobile == true }}
        run: |
          echo "::warning::GNOME Mobile requires mutter & gnome-settings-daemon from @mobility/gnome-mobile COPR."
          echo "::warning::Check build status: https://copr.fedorainfracloud.org/coprs/g/mobility/gnome-mobile/monitor/"
          sudo chroot "$ROOTFS_MOUNT" dnf copr enable -y @mobility/gnome-mobile
          sudo chroot "$ROOTFS_MOUNT" dnf install -y mutter gnome-settings-daemon gnome-shell || {
            echo "::error::GNOME Mobile packages failed to install."
            echo "::error::Packages may not be built for Fedora ${{ inputs.fedora_version }}."
            echo "::error::Check: https://copr.fedorainfracloud.org/coprs/g/mobility/gnome-mobile/monitor/"
            exit 1
          }
          sudo chroot "$ROOTFS_MOUNT" dnf install -y \
            pipewire-pulseaudio pipewire-alsa pipewire-jack-audio-connection-kit \
            gnome-session gnome-terminal \
            gdm gnome-control-center systemd-pam \
            xdg-desktop-portal-gnome xdg-desktop-portal-gtk \
            xorg-x11-server-Xwayland \
            nautilus gvfs-mtp
          echo "✓ GNOME Mobile installed"

      - name: "Install KDE Plasma"
        if: ${{ inputs.desktop == 'KDE Plasma' && inputs.plasma_mobile == false }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y \
            pipewire-pulseaudio pipewire-alsa pipewire-jack-audio-connection-kit \
            plasma-desktop \
            sddm konsole dolphin kate \
            systemd-pam \
            xdg-desktop-portal-kde kio-admin
          echo "✓ KDE Plasma installed"

      - name: "Install KDE Plasma Mobile"
        if: ${{ inputs.desktop == 'KDE Plasma' && inputs.plasma_mobile == true }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y \
            pipewire-pulseaudio pipewire-alsa pipewire-jack-audio-connection-kit \
            plasma-mobile \
            sddm konsole dolphin kate \
            systemd-pam \
            xdg-desktop-portal-kde kio-admin
          echo "✓ KDE Plasma Mobile installed"

      - name: "Install Denial"
        if: ${{ inputs.desktop == 'Denial' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y \
            pipewire-pulseaudio pipewire-alsa pipewire-jack-audio-connection-kit \
            systemd-pam upower bluez
          echo "✓ Denial installed"

      - name: "Install Plymouth"
        if: ${{ steps.quiet.outputs.enabled == 'true' }}
        run: |
          if [[ "${{ inputs.plymouth_theme }}" == "default" ]]; then
            if [[ "${{ inputs.desktop }}" == "KDE Plasma" ]]; then
              THEME_PKG="plymouth-theme-breeze"
            else
              THEME_PKG="plymouth-theme-spinner"
            fi
          elif [[ "${{ inputs.plymouth_theme }}" == "none" ]]; then
            THEME_PKG=""
          else
            THEME_PKG="${{ inputs.plymouth_theme }}"
          fi
          INSTALL_PKGS="plymouth"
          if [[ -n "$THEME_PKG" ]]; then
            INSTALL_PKGS="$INSTALL_PKGS $THEME_PKG"
          fi
          if [[ "${{ inputs.desktop }}" == "KDE Plasma" ]]; then
            INSTALL_PKGS="$INSTALL_PKGS plymouth-kcm"
          fi
          sudo chroot "$ROOTFS_MOUNT" dnf install -y $INSTALL_PKGS
          echo "✓ Plymouth installed with ${THEME_PKG:-no theme}"

      - name: "Configure Display Manager"
        run: |
          if [[ "${{ inputs.desktop }}" == "GNOME" ]]; then
            sudo chroot "$ROOTFS_MOUNT" systemctl enable gdm
          elif [[ "${{ inputs.desktop }}" == "KDE Plasma" ]]; then
            sudo chroot "$ROOTFS_MOUNT" systemctl enable sddm
          fi
          echo "✓ Display manager configured"

      - name: "Configure Autologin"
        if: ${{ inputs.autologin == true && inputs.desktop != 'server' }}
        run: |
          USERNAME="${{ inputs.username }}"
          if [[ "${{ inputs.desktop }}" == "GNOME" ]]; then
            sudo mkdir -p "$ROOTFS_MOUNT/etc/gdm"
            printf '[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=%s\n' "$USERNAME" | \
              sudo tee "$ROOTFS_MOUNT/etc/gdm/custom.conf" > /dev/null
            echo "✓ GDM autologin configured"
          elif [[ "${{ inputs.desktop }}" == "KDE Plasma" ]]; then
            if [[ "${{ inputs.plasma_mobile }}" == "true" ]]; then
              SESSION="plasma-mobile"
            else
              SESSION="plasma"
            fi
            sudo sed -i "/^\[General\]/a DefaultSession=${SESSION}.desktop" "$ROOTFS_MOUNT/etc/sddm.conf"
            if [[ "${{ inputs.autologin }}" == "true" ]]; then
              sudo mkdir -p "$ROOTFS_MOUNT/etc/sddm.conf.d"
              printf '[Autologin]\nUser=%s\nSession=%s\n' "$USERNAME" "$SESSION" | \
                sudo tee "$ROOTFS_MOUNT/etc/sddm.conf.d/autologin.conf" > /dev/null
              echo "✓ SDDM configured (session: $SESSION, autologin: $USERNAME)"
            else
              echo "✓ SDDM configured (default session: $SESSION, autologin disabled)"
            fi
          elif [[ "${{ inputs.desktop }}" == "Denial" ]]; then
            sudo mkdir -p "$ROOTFS_MOUNT/etc/systemd/system/getty@tty1.service.d"
            printf '[Service]\nExecStart=\nExecStart=-/usr/sbin/agetty --noreset --noclear --autologin %s - $TERM\n' \
              "$USERNAME" | \
              sudo tee "$ROOTFS_MOUNT/etc/systemd/system/getty@tty1.service.d/autologin.conf" > /dev/null
            echo "✓ Denial getty autologin configured for $USERNAME"
          fi

      - name: "Set Graphical Target"
        if: ${{ inputs.desktop != 'server' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl set-default graphical.target
          echo "✓ graphical.target set as default"

      - name: "Set Hostname"
        run: |
          echo "${{ inputs.hostname }}" | sudo tee "$ROOTFS_MOUNT/etc/hostname"
          if ! grep -q "127.0.1.1.*${{ inputs.hostname }}" "$ROOTFS_MOUNT/etc/hosts"; then
            echo "127.0.1.1 ${{ inputs.hostname }}" | sudo tee -a "$ROOTFS_MOUNT/etc/hosts"
          fi
          echo "CHASSIS=tablet" | sudo tee "$ROOTFS_MOUNT/etc/machine-info"
          echo "✓ Hostname set to ${{ inputs.hostname }}"

      - name: "Configure Locale"
        run: |
          LANG_CHOICE="${{ inputs.language }}"

          if [ "$LANG_CHOICE" = 'None (C.UTF-8)' ]; then
            echo "✓ System locale stays C.UTF-8"
          else
            LANG_PACK=$(echo "$LANG_CHOICE" | sed 's/\.UTF-8//' | cut -d'_' -f1 | tr '[:upper:]' '[:lower:]')
            sudo chroot "$ROOTFS_MOUNT" dnf install -y "glibc-langpack-${LANG_PACK}"
            echo "LANG=$LANG_CHOICE" | sudo tee "$ROOTFS_MOUNT/etc/locale.conf" > /dev/null
            echo "✓ Locale set to $LANG_CHOICE"
          fi

      - name: "Create User"
        run: |
          sudo chroot "$ROOTFS_MOUNT" useradd \
            -m -s /bin/bash \
            -G wheel \
            "${{ inputs.username }}"
          echo "✓ User ${{ inputs.username }} created"

      - name: "Set Passwords"
        env:
          ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [[ -z "$ROOTFS_PASSWORD" ]]; then
            ROOTFS_PASSWORD="password"
          else
            echo "::add-mask::$ROOTFS_PASSWORD"
          fi
          printf '%s:%s\n' "${{ inputs.username }}" "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          printf 'root:%s\n' "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          echo "✓ Passwords set"

      - name: "Configure Denial Session"
        if: ${{ inputs.desktop == 'Denial' }}
        run: |
          USERNAME="${{ inputs.username }}"
          if [[ "${{ inputs.autologin }}" == "true" ]]; then
            SESSION_FLAGS="--start-locked"
          else
            SESSION_FLAGS=""
          fi
          if [[ "${{ inputs.denial_mobile }}" == "true" ]]; then
            SHELL_PROFILE="mobile"
          else
            SHELL_PROFILE="desktop"
          fi
          sudo tee "$ROOTFS_MOUNT/home/$USERNAME/.bash_profile" > /dev/null <<EOF
          # .bash_profile

          # Get the aliases and functions
          if [ -f ~/.bashrc ]; then
              . ~/.bashrc
          fi

          export DENIA_SHELL_PROFILE=$SHELL_PROFILE

          # Start Denial compositor on the autologin console tty
          if [ "\$(tty)" = "/dev/tty1" ] && [ -z "\${SSH_CONNECTION:-}" ] && [ -z "\${WAYLAND_DISPLAY:-}" ]; then
            exec denial-session $SESSION_FLAGS
          fi
          EOF
          sudo chroot "$ROOTFS_MOUNT" chown "$USERNAME:wheel" "/home/$USERNAME/.bash_profile"
          # logind: power key suspends (Denial idle policy handles lock/DPMS)
          sudo mkdir -p "$ROOTFS_MOUNT/etc/systemd/logind.conf.d"
          printf '[Login]\nHandlePowerKey=suspend\n' | \
            sudo tee "$ROOTFS_MOUNT/etc/systemd/logind.conf.d/50-denial-power.conf" > /dev/null
          sudo chroot "$ROOTFS_MOUNT" systemctl enable bluetooth
          echo "✓ Denial session configured on tty1 (shell: $SHELL_PROFILE, autologin lock: ${{ inputs.autologin }}, power key: suspend)"

      - name: "Enable Services"
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable NetworkManager
          sudo chroot "$ROOTFS_MOUNT" systemctl enable systemd-resolved
          sudo chroot "$ROOTFS_MOUNT" systemctl enable systemd-timesyncd
          sudo chroot "$ROOTFS_MOUNT" systemctl disable firewalld
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sheng-devauth
          sudo chroot "$ROOTFS_MOUNT" systemctl enable xiaomi-sheng-thp
          sudo chroot "$ROOTFS_MOUNT" systemctl enable xiaomi-charger-mode
          sudo chroot "$ROOTFS_MOUNT" systemctl enable adsprpcd-sensorspd
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sheng-audio-init.service
          echo "✓ Services enabled"

      - name: "Enable sheng-tablet-mode (GNOME auto-rotation)"
        if: ${{ inputs.desktop == 'GNOME' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable fake-tablet-mode.service

      - name: "Configure sudo"
        run: |
          echo "%wheel ALL=(ALL:ALL) ALL" | sudo tee "$ROOTFS_MOUNT/etc/sudoers.d/wheel"
          sudo chmod 440 "$ROOTFS_MOUNT/etc/sudoers.d/wheel"
          echo "✓ sudo configured for wheel group"

      - name: "Disable SELinux"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT/etc/selinux"
          echo "SELINUX=disabled" | sudo tee "$ROOTFS_MOUNT/etc/selinux/config"
          echo "SELINUXTYPE=targeted" | sudo tee -a "$ROOTFS_MOUNT/etc/selinux/config"
          echo "✓ SELinux disabled"

      - name: "Configure fstab"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          echo "PARTLABEL=$PARTITION / ext4 defaults,x-systemd.growfs 0 1" | \
            sudo tee "$ROOTFS_MOUNT/etc/fstab"
          echo "✓ fstab configured: root=PARTLABEL=$PARTITION"

      - name: "Clean DNF Cache"
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf clean all
          sudo rm -rf "$ROOTFS_MOUNT/var/cache/dnf"
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf"
          sudo ln -s ../run/NetworkManager/resolv.conf "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ DNF cache cleaned"

      - name: "Generate boot.img"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          CMDLINE="root=PARTLABEL=$PARTITION"

          if [[ "${{ steps.quiet.outputs.enabled }}" == "true" ]]; then
            CMDLINE="$CMDLINE quiet splash plymouth.ignore-serial-consoles fbcon=map:1"
          fi

          cat "$ROOTFS_MOUNT/boot/Image.gz" \
              "$ROOTFS_MOUNT/boot/sm8550-xiaomi-sheng.dtb" \
            > Image.gz-dtb_sheng

          chmod +x mkbootimg
          ./mkbootimg \
            --kernel Image.gz-dtb_sheng \
            --cmdline "$CMDLINE" \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --tags_offset 0x01e00000 \
            --pagesize 4096 \
            --id \
            -o boot.img
          echo "✓ boot.img generated (cmdline: $CMDLINE)"

      - name: "Unmount Virtual File Systems"
        if: always()
        run: |
          for mp in "$ROOTFS_MOUNT/dev/pts" "$ROOTFS_MOUNT/dev" "$ROOTFS_MOUNT/proc" "$ROOTFS_MOUNT/sys"; do
            if mountpoint -q "$mp" 2>/dev/null; then
              sudo umount "$mp"
            fi
          done
          echo "✓ Virtual file systems unmounted"

      - name: "Unmount Image & Set UUID"
        run: |
          if mountpoint -q "$ROOTFS_MOUNT" 2>/dev/null; then
            sudo umount "$ROOTFS_MOUNT"
          fi
          e2fsck -f -y rootfs.img
          tune2fs -U ee8d3593-59b1-480e-a3b6-4fefb17ee7d8 rootfs.img
          echo "✓ Image unmounted, UUID set"

      - name: "Upload Boot Image"
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ steps.kernel.outputs.name }}-${{ steps.partition.outputs.label }}${{ steps.quiet.outputs.enabled == 'true' && '-plymouth' || '' }}
          path: boot.img
          retention-days: 14
          if-no-files-found: warn

      - name: "Upload RootFS Image"
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ inputs.fedora_version }}-${{ steps.de.outputs.name }}-${{ steps.partition.outputs.label }}
          path: rootfs.img
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
