name: Build Fedora RootFS

on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora Version'
        type: choice
        options:
          - 44
          - 45
        default: '44'

      autologin:
        description: 'Autologin'
        type: boolean
        default: true

      username:
        description: 'Username'
        type: string
        default: 'username'

      hostname:
        description: 'Hostname'
        type: string
        default: 'xiaomi-sheng'

      language:
        description: 'System language'
        type: choice
        options:
          - 'None (C.UTF-8)'
          - 'en_US.UTF-8'
          - 'zh_CN.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
        default: 'None (C.UTF-8)'

      extra_packages:
        description: 'Extra packages to install (space-separated)'
        type: string
        required: false
        default: ''

      boot_mode:
        description: |
          Boot mode:
          - single: Boot from partition "userdata"
          - dual: Boot from partition "linux"
          - custom: Boot from custom partition
        type: choice
        options:
          - 'single (userdata)'
          - 'dual (linux)'
          - 'custom'
        default: 'dual (linux)'

      custom_partition:
        description: 'Custom partition (required when boot_mode=custom)'
        type: string
        required: false
        default: ''

      kernel_source:
        description: |
          Kernel Source:
          - prebuilt: Use prebuilt kernel RPM
          - custom_build: Build from source
        type: choice
        options:
          - 'prebuilt'
          - 'custom_build'
        default: 'prebuilt'

      kernel_prebuilt:
        description: 'Prebuilt kernel source (only when kernel_source=prebuilt)'
        type: choice
        options:
          - 'upstream'
          - 'own'
        default: 'upstream'

      kernel_repo:
        description: 'Kernel Repo URL (only when kernel_source=custom_build)'
        type: string
        required: false
        default: 'https://github.com/ianchb/sm8550-mainline'

      kernel_branch:
        description: 'Kernel branch name or release tag (custom_build: upstream branch, prebuilt: release tag)'
        type: string
        required: false
        default: 'sheng-7.2.2'

      kernel_config:
        description: 'Kernel Config file path in repo (only when kernel_source=custom_build)'
        type: string
        required: false
        default: 'sm8550.config'

      firmware_repo:
        description: 'Firmware Repo URL'
        type: string
        required: false
        default: 'https://github.com/ianchb/sheng-firmware'

      firmware_branch:
        description: 'Firmware Branch'
        type: string
        required: false
        default: 'master'

jobs:
  # ==========================================================================
  # Build Kernel
  # ==========================================================================
  build-kernel:
    name: "Build Kernel"
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.kernel_source == 'custom_build' }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,pch_defines,include_file_mtime

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc \
            cpio kmod libncurses-dev rpm \
            clang llvm lld ccache
          echo "✓ Build tools installed"

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: "Reset ccache stats"
        run: ccache -z

      - name: "Clone Kernel Source"
        run: |
          git clone "${{ inputs.kernel_repo }}" \
            --branch "${{ inputs.kernel_branch }}" \
            --depth 1 \
            linux
          echo "✓ Kernel source cloned"

      - name: "Build Kernel"
        id: build
        run: |
          cd linux
          cp "${{ github.workspace }}/${{ inputs.kernel_config }}" .config

          export CC="ccache clang"
          export CXX="ccache clang++"

          make -j$(nproc) ARCH=arm64 LLVM=1

          KVER="$(make kernelrelease -s)"
          echo "kernel_version=$KVER" >> $GITHUB_OUTPUT
          echo "  Kernel version: $KVER"

          make -j$(nproc) ARCH=arm64 LLVM=1 \
            INSTALL_MOD_PATH="${{ github.workspace }}/kernel-staging" \
            modules_install

          echo "✓ Kernel build complete"

          mkdir -p "${{ github.workspace }}/kernel-staging/boot"
          install -Dm644 arch/arm64/boot/Image.gz \
            "${{ github.workspace }}/kernel-staging/boot/Image.gz"
          install -Dm644 arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            "${{ github.workspace }}/kernel-staging/boot/sm8550-xiaomi-sheng.dtb"
          install -Dm644 .config \
            "${{ github.workspace }}/kernel-staging/boot/config-${KVER}"

          cd "${{ github.workspace }}"
          cat linux/arch/arm64/boot/Image.gz \
              linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            > Image.gz-dtb_sheng
          cp Image.gz-dtb_sheng "${{ github.workspace }}/kernel-staging/boot/"

      - name: "Package Kernel RPM"
        run: |
          KREL="${{ inputs.kernel_branch }}"
          KREL="${KREL#*-}"
          TOPDIR="${{ github.workspace }}/rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cp rpm/kernel-sheng.spec "$TOPDIR/SPECS/kernel-sheng.spec"

          cd "${{ github.workspace }}/kernel-staging"
          mkdir -p "kernel-sheng-${KREL}"
          mv boot lib "kernel-sheng-${KREL}/"
          tar -czf "$TOPDIR/SOURCES/kernel-sheng-${KREL}.tar.gz" "kernel-sheng-${KREL}"

          cd "$TOPDIR"
          rpmbuild --define "_topdir $TOPDIR" \
                   --define "_kernel_version ${KREL}" \
                   --define "_kernel_repo ${{ inputs.kernel_repo }}" \
                   --define "_kernel_config ${{ github.workspace }}/${{ inputs.kernel_config }}" \
                   --nodeps -ba SPECS/kernel-sheng.spec
          echo "✓ Kernel RPM packaged (${KREL})"
          ls -la RPMS/aarch64/

      - name: "Upload Kernel Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: kernel-sheng
          path: rpmbuild/RPMS/aarch64/kernel-sheng-*.rpm
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # Build Custom RPMs (in Fedora container)
  # ==========================================================================
  build-rpms:
    name: "Build Custom RPMs"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Build RPMs in Fedora Container"
        run: |
          FEDORA_VERSION=${{ inputs.fedora_version }}
          podman pull registry.fedoraproject.org/fedora:${FEDORA_VERSION}

          podman run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e FIRMWARE_REPO="${{ inputs.firmware_repo }}" \
            -e FIRMWARE_BRANCH="${{ inputs.firmware_branch }}" \
            registry.fedoraproject.org/fedora:${FEDORA_VERSION} \
            bash /workspace/.github/build-rpms.sh "${FEDORA_VERSION}"

      - name: "Clean debuginfo/devel RPMs"
        run: find rpmbuild/RPMS -name "*-debuginfo-*" -o -name "*-devel-*" | xargs rm -f

      - name: "Upload libssc RPM"
        uses: actions/upload-artifact@v7
        with:
          name: libssc-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/aarch64/libssc-[0-9]*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload fastrpc RPM"
        uses: actions/upload-artifact@v7
        with:
          name: fastrpc-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/aarch64/fastrpc-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-sheng-thp RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-thp-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/aarch64/xiaomi-sheng-thp-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-sheng-keyboard-helper RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-keyboard-helper-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/aarch64/xiaomi-sheng-keyboard-helper-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload iio-sensor-proxy RPM"
        uses: actions/upload-artifact@v7
        with:
          name: iio-sensor-proxy-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/aarch64/iio-sensor-proxy-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload firmware-xiaomi-sheng RPM"
        uses: actions/upload-artifact@v7
        with:
          name: firmware-xiaomi-sheng-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/noarch/firmware-xiaomi-sheng-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload sheng-devauth RPM"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-devauth-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/aarch64/sheng-devauth-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-mipps-auth RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-mipps-auth-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/noarch/xiaomi-mipps-auth-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-charger-mode RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-charger-mode-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/noarch/xiaomi-charger-mode-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload xiaomi-sheng-keyboard-backlight RPM"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-keyboard-backlight-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/noarch/xiaomi-sheng-keyboard-backlight-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload sheng-sensors RPM"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-sensors-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/noarch/sheng-sensors-*.rpm
          retention-days: 3
          if-no-files-found: error

      - name: "Upload alsa-xiaomi-sheng RPM"
        uses: actions/upload-artifact@v7
        with:
          name: alsa-xiaomi-sheng-rpm-fc${{ inputs.fedora_version }}
          path: rpmbuild/RPMS/noarch/alsa-xiaomi-sheng-*.rpm
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # Build RootFS
  # ==========================================================================
  build-rootfs:
    name: "Build Fedora RootFS"
    runs-on: ubuntu-24.04-arm
    needs: [build-rpms, build-kernel]
    if: ${{ !cancelled() && needs.build-rpms.result == 'success' && (needs.build-kernel.result == 'success' || needs.build-kernel.result == 'skipped') }}

    env:
      ROOTFS_MOUNT: /mnt/rootfs
      IMAGE_SIZE: 10G

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y tar xz-utils e2fsprogs dnf
          echo "✓ Build tools installed"

      - name: "Download RPM Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: rpm/
          merge-multiple: true

      - name: "Download Kernel Artifact (custom_build)"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/download-artifact@v8
        with:
          name: kernel-sheng
          path: rpm/

      - name: "Download Kernel RPM (prebuilt upstream)"
        if: ${{ inputs.kernel_source == 'prebuilt' && inputs.kernel_prebuilt == 'upstream' }}
        run: |
          gh release download "${{ inputs.kernel_branch }}" \
            --repo mumuxiao722/fedora-sheng \
            --pattern "kernel-sheng.zip" \
            --dir rpm/ \
            --clobber
          cd rpm && unzip -o kernel-sheng.zip && cd ..
          echo "✓ Kernel RPM downloaded from upstream (${{ inputs.kernel_branch }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download Kernel RPM (prebuilt own)"
        if: ${{ inputs.kernel_source == 'prebuilt' && inputs.kernel_prebuilt == 'own' }}
        run: |
          gh release download "${{ inputs.kernel_branch }}" \
            --repo "${{ github.repository }}" \
            --pattern "kernel-sheng.zip" \
            --dir rpm/ \
            --clobber
          cd rpm && unzip -o kernel-sheng.zip && cd ..
          echo "✓ Kernel RPM downloaded from own release (${{ inputs.kernel_branch }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Parse Partition Label"
        id: partition
        run: |
          case "${{ inputs.boot_mode }}" in
            'single (userdata)')
              echo "label=userdata" >> $GITHUB_OUTPUT
              ;;
            'dual (linux)')
              echo "label=linux" >> $GITHUB_OUTPUT
              ;;
            'custom')
              echo "label=${{ inputs.custom_partition }}" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "✓ Partition label set"

      - name: "Create RootFS Image"
        run: |
          truncate -s "$IMAGE_SIZE" rootfs.img
          mkfs.ext4 rootfs.img
          echo "✓ RootFS image created (${IMAGE_SIZE})"

      - name: "Mount RootFS Image"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT"
          sudo mount -o loop rootfs.img "$ROOTFS_MOUNT"
          echo "✓ RootFS image mounted at $ROOTFS_MOUNT"

      - name: "Install Fedora via DNF"
        run: |
          FEDORA_VERSION=${{ inputs.fedora_version }}
          sudo podman run --rm \
            -v "/mnt/rootfs:/mnt/rootfs" \
            registry.fedoraproject.org/fedora:${FEDORA_VERSION} \
            dnf \
              --installroot=/mnt/rootfs \
              --releasever=${FEDORA_VERSION} \
              --use-host-config \
              --setopt=install_weak_deps=False \
              --setopt=tsflags=nodocs \
              install -y \
              @core \
              systemd systemd-sysv \
              sudo curl \
              NetworkManager openssh-server \
              wpa_supplicant dbus \
              ca-certificates \
              iw \
              lm_sensors \
              wireless-regdb \
              glib2 \
              libqmi \
              libmbim \
              polkit
          echo "✓ DNF installroot complete"

      - name: "Mount Virtual File Systems"
        run: |
          sudo mount --bind /dev "$ROOTFS_MOUNT/dev"
          sudo mount --bind /dev/pts "$ROOTFS_MOUNT/dev/pts"
          sudo mount -t proc proc "$ROOTFS_MOUNT/proc"
          sudo mount -t sysfs sys "$ROOTFS_MOUNT/sys"
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf"
          sudo cp /etc/resolv.conf "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ Virtual file systems mounted"

      - name: "Install Custom RPMs"
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y \
            alsa-ucm-conf \
            libbsd \
            libgudev \
            protobuf-c-libs
          sudo chroot "$ROOTFS_MOUNT" dnf mark install \
            alsa-ucm-conf \
            libbsd \
            libgudev \
            protobuf-c-libs
          find rpm/ -name "*.rpm" ! -name "*-devel-*" ! -name "*-debuginfo-*" -exec sudo cp {} "$ROOTFS_MOUNT/tmp/" \;
          sudo chroot "$ROOTFS_MOUNT" rpm -Uvh /tmp/*.rpm
          sudo rm -f "$ROOTFS_MOUNT/tmp/"*.rpm
          echo "✓ Custom RPMs installed"

      - name: "Versionlock Custom Packages"
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf install -y python3-dnf-plugin-versionlock
          sudo chroot "$ROOTFS_MOUNT" dnf versionlock add iio-sensor-proxy
          echo "✓ Versionlock applied"

      - name: "Install Extra Packages"
        if: ${{ inputs.extra_packages != '' }}
        run: |
          EXTRA_PKGS="${{ inputs.extra_packages }}"
          echo "  Extra packages: $EXTRA_PKGS"
          sudo chroot "$ROOTFS_MOUNT" dnf install -y $EXTRA_PKGS
          echo "✓ Extra packages installed"

      - name: "Set Hostname"
        run: |
          echo "${{ inputs.hostname }}" | sudo tee "$ROOTFS_MOUNT/etc/hostname"
          if ! grep -q "127.0.1.1.*${{ inputs.hostname }}" "$ROOTFS_MOUNT/etc/hosts"; then
            echo "127.0.1.1 ${{ inputs.hostname }}" | sudo tee -a "$ROOTFS_MOUNT/etc/hosts"
          fi
          echo "✓ Hostname set to ${{ inputs.hostname }}"

      - name: "Configure Locale"
        run: |
          LANG_CHOICE="${{ inputs.language }}"

          if [ "$LANG_CHOICE" = 'None (C.UTF-8)' ]; then
            echo "✓ System locale stays C.UTF-8"
          else
            sudo chroot "$ROOTFS_MOUNT" dnf install -y glibc-langpack-en
            sudo chroot "$ROOTFS_MOUNT" localectl set-locale LANG="$LANG_CHOICE"
            echo "LANG=$LANG_CHOICE" | sudo tee "$ROOTFS_MOUNT/etc/locale.conf"
            echo "✓ Locale set to $LANG_CHOICE"
          fi

      - name: "Create User"
        run: |
          sudo chroot "$ROOTFS_MOUNT" useradd \
            -m -s /bin/bash \
            -G wheel \
            "${{ inputs.username }}"
          echo "✓ User ${{ inputs.username }} created"

      - name: "Set Passwords"
        env:
          ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [[ -z "$ROOTFS_PASSWORD" ]]; then
            ROOTFS_PASSWORD="password"
          else
            echo "::add-mask::$ROOTFS_PASSWORD"
          fi
          printf '%s:%s\n' "${{ inputs.username }}" "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          printf 'root:%s\n' "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          echo "✓ Passwords set"

      - name: "Enable Services"
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable NetworkManager
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sshd
          sudo chroot "$ROOTFS_MOUNT" systemctl enable qrtr-ns || {
            sudo mkdir -p "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service.d"
            echo "[Unit]" | sudo tee "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "Description=Qualcomm IPC Router Service (QRTR)" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "After=network.target" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "[Service]" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "ExecStart=/usr/bin/qrtr-ns -f" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "Restart=always" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "[Install]" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "WantedBy=multi-user.target" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            sudo chroot "$ROOTFS_MOUNT" systemctl enable qrtr-ns
          }
          echo "✓ Services enabled"

      - name: "Configure sudo"
        run: |
          echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" | sudo tee "$ROOTFS_MOUNT/etc/sudoers.d/wheel"
          sudo chmod 440 "$ROOTFS_MOUNT/etc/sudoers.d/wheel"
          echo "✓ sudo configured for wheel group"

      - name: "Disable SELinux"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT/etc/selinux"
          echo "SELINUX=disabled" | sudo tee "$ROOTFS_MOUNT/etc/selinux/config"
          echo "SELINUXTYPE=targeted" | sudo tee -a "$ROOTFS_MOUNT/etc/selinux/config"
          echo "✓ SELinux disabled"

      - name: "Configure fstab"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          echo "PARTLABEL=$PARTITION / ext4 defaults,x-systemd.growfs 0 1" | \
            sudo tee "$ROOTFS_MOUNT/etc/fstab"
          echo "✓ fstab configured: root=PARTLABEL=$PARTITION"

      - name: "Clean DNF Cache"
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf clean all
          sudo rm -rf "$ROOTFS_MOUNT/var/cache/dnf"
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf"
          sudo ln -s ../run/NetworkManager/resolv.conf "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ DNF cache cleaned"

      - name: "Generate boot.img"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          CMDLINE="root=PARTLABEL=$PARTITION"

          cat "$ROOTFS_MOUNT/boot/Image.gz" \
              "$ROOTFS_MOUNT/boot/sm8550-xiaomi-sheng.dtb" \
            > Image.gz-dtb_sheng

          chmod +x mkbootimg
          ./mkbootimg \
            --kernel Image.gz-dtb_sheng \
            --cmdline "$CMDLINE" \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --tags_offset 0x01e00000 \
            --pagesize 4096 \
            --id \
            -o boot.img
          echo "✓ boot.img generated (cmdline: $CMDLINE)"

      - name: "Unmount Virtual File Systems"
        if: always()
        run: |
          for mp in "$ROOTFS_MOUNT/dev/pts" "$ROOTFS_MOUNT/dev" "$ROOTFS_MOUNT/proc" "$ROOTFS_MOUNT/sys"; do
            if mountpoint -q "$mp" 2>/dev/null; then
              sudo umount "$mp"
            fi
          done
          echo "✓ Virtual file systems unmounted"

      - name: "Unmount Image & Set UUID"
        run: |
          if mountpoint -q "$ROOTFS_MOUNT" 2>/dev/null; then
            sudo umount "$ROOTFS_MOUNT"
          fi
          tune2fs -U random rootfs.img
          echo "✓ Image unmounted, UUID set"

      - name: "Zip & Upload RootFS Image"
        run: zip "rootfs-${{ inputs.fedora_version }}-${{ steps.partition.outputs.label }}.zip" rootfs.img

      - name: "Upload RootFS Image"
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ inputs.fedora_version }}-${{ steps.partition.outputs.label }}
          path: rootfs-*.zip
          retention-days: 14
          if-no-files-found: error

      - name: "Zip & Upload Boot Image"
        run: zip "boot-${{ inputs.fedora_version }}-${{ steps.partition.outputs.label }}.zip" boot.img

      - name: "Upload Boot Image"
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ inputs.fedora_version }}-${{ steps.partition.outputs.label }}
          path: boot-*.zip
          retention-days: 14
          if-no-files-found: warn
