name: Build Fedora RootFS

on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora Version'
        type: choice
        options:
          - 45
          - rawhide
        default: '45'

      autologin:
        description: 'Autologin'
        type: boolean
        default: true

      username:
        description: 'Username'
        type: string
        default: 'username'

      hostname:
        description: 'Hostname'
        type: string
        default: 'xiaomi-sheng'

      language:
        description: 'System language'
        type: choice
        options:
          - 'None (C.UTF-8)'
          - 'en_US.UTF-8'
          - 'zh_CN.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
        default: 'None (C.UTF-8)'

      boot_mode:
        description: |
          Boot mode:
          - single: Boot from partition "userdata"
          - dual: Boot from partition "linux"
          - custom: Boot from custom partition
        type: choice
        options:
          - 'single (userdata)'
          - 'dual (linux)'
          - 'custom'
        default: 'dual (linux)'

      custom_partition:
        description: 'Custom partition (required when boot_mode=custom)'
        type: string
        required: false
        default: ''

      extra_packages:
        description: 'Extra packages to install (space-separated)'
        type: string
        required: false
        default: ''

      firmware_repo:
        description: 'Firmware Repo URL'
        type: string
        required: false
        default: 'https://github.com/ianchb/sheng-firmware'

      firmware_branch:
        description: 'Firmware Branch'
        type: string
        required: false
        default: 'master'

jobs:
  # ==========================================================================
  # Build Custom RPMs
  # ==========================================================================
  build-rpms:
    name: "Build Custom RPMs"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install RPM Build Tools"
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y rpm gcc make gcc-aarch64-linux-gnu \
            libglib2.0-dev \
            meson ninja-build \
            libqmi-dev libprotobuf-c-dev protobuf-c-compiler \
            libbsd-dev libgudev-1.0-dev libpolkit-gobject-1-dev
          echo "✓ RPM build tools installed"

      - name: "Clone Source Repos"
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Clone all source repos
          git clone --depth 1 https://github.com/ianchb/sheng-firmware.git /tmp/sheng-firmware
          git clone --depth 1 https://github.com/alghiffaryfa19/Linux-xiaomi-sheng.git --branch sheng --single-branch /tmp/sheng-devauth-src
          git clone --depth 1 https://github.com/ianchb/xiaomi-mipps-auth.git /tmp/xiaomi-mipps-auth
          git clone --depth 1 https://github.com/ianchb/xiaomi-charger-mode.git /tmp/xiaomi-charger-mode
          git clone --depth 1 https://github.com/ianchb/xiaomi-sheng-thp.git /tmp/xiaomi-sheng-thp
          git clone --depth 1 https://github.com/ianchb/xiaomi-pen-status.git /tmp/xiaomi-pen-status
          git clone --depth 1 https://github.com/slhssb/xiaomi-sheng-keyboard-backlight.git /tmp/xiaomi-sheng-keyboard-backlight
          git clone --depth 1 https://github.com/ianchb/xiaomi-sheng-keyboard-helper.git /tmp/xiaomi-sheng-keyboard-helper
          git clone --depth 1 https://github.com/qualcomm/fastrpc.git /tmp/fastrpc
          git clone --depth 1 https://codeberg.org/DylanVanAssche/libssc.git /tmp/libssc
          git clone --depth 1 https://gitlab.freedesktop.org/hadess/iio-sensor-proxy.git /tmp/iio-sensor-proxy
          git clone --depth 1 https://github.com/ianchb/xiaomi-sheng-fingerprint.git /tmp/xiaomi-sheng-fingerprint
          git clone --depth 1 https://github.com/alghiffaryfa19/sheng-sensors-file.git /tmp/sheng-sensors-file
          echo "✓ Source repos cloned"

      - name: "Create Source Tarballs"
        run: |
          cd /tmp

          # firmware-xiaomi-sheng
          mv sheng-firmware sheng-firmware-1.0
          tar -czf ~/rpmbuild/SOURCES/firmware-xiaomi-sheng-1.0.tar.gz sheng-firmware-1.0/

          # sheng-devauth (rename dir to match %autosetup -n sheng_devauth-1.0)
          mv sheng-devauth-src/sheng-devauth sheng_devauth-1.0
          tar -czf ~/rpmbuild/SOURCES/sheng-devauth-1.0.tar.gz sheng_devauth-1.0/
          mv sheng_devauth-1.0 sheng-devauth-src/

          # xiaomi-mipps-auth
          mv xiaomi-mipps-auth xiaomi-mipps-auth-1.0
          tar -czf ~/rpmbuild/SOURCES/xiaomi-mipps-auth-1.0.tar.gz xiaomi-mipps-auth-1.0/

          # xiaomi-charger-mode
          mv xiaomi-charger-mode xiaomi-charger-mode-1.0
          tar -czf ~/rpmbuild/SOURCES/xiaomi-charger-mode-1.0.tar.gz xiaomi-charger-mode-1.0/

          # xiaomi-sheng-thp
          mv xiaomi-sheng-thp xiaomi-sheng-thp-0.4.0
          tar -czf ~/rpmbuild/SOURCES/xiaomi-sheng-thp-0.4.0.tar.gz xiaomi-sheng-thp-0.4.0/

          # xiaomi-pen-status
          mv xiaomi-pen-status xiaomi-pen-status-1.0
          tar -czf ~/rpmbuild/SOURCES/xiaomi-pen-status-1.0.tar.gz xiaomi-pen-status-1.0/

          # xiaomi-sheng-keyboard-backlight
          mv xiaomi-sheng-keyboard-backlight xiaomi-sheng-keyboard-backlight-1.0
          tar -czf ~/rpmbuild/SOURCES/xiaomi-sheng-keyboard-backlight-1.0.tar.gz xiaomi-sheng-keyboard-backlight-1.0/

          # xiaomi-sheng-keyboard-helper
          mv xiaomi-sheng-keyboard-helper xiaomi-sheng-keyboard-helper-1.0
          tar -czf ~/rpmbuild/SOURCES/xiaomi-sheng-keyboard-helper-1.0.tar.gz xiaomi-sheng-keyboard-helper-1.0/

          # xiaomi-sheng-fingerprint
          mv xiaomi-sheng-fingerprint xiaomi-sheng-fingerprint-0.1.4
          tar -czf ~/rpmbuild/SOURCES/xiaomi-sheng-fingerprint-0.1.4.tar.gz xiaomi-sheng-fingerprint-0.1.4/

          # sheng-sensors (from alghiffaryfa19, flatten directory)
          cd /tmp/sheng-sensors-file
          tar -czf ~/rpmbuild/SOURCES/sheng-sensors-20240917.tar.gz .
          cd /tmp

          # alsa-xiaomi-sheng (from repo, flatten directory)
          cd "$GITHUB_WORKSPACE/alsa-xiaomi-sheng"
          tar -czf ~/rpmbuild/SOURCES/alsa-xiaomi-sheng-1.0.tar.gz .
          cd /tmp

          # fastrpc (need parent dir for %autosetup)
          cd /tmp && mv fastrpc fastrpc-1.0.2
          tar -czf ~/rpmbuild/SOURCES/fastrpc-1.0.2.tar.gz fastrpc-1.0.2/

          # libssc (need parent dir for %autosetup)
          cd /tmp && mv libssc libssc-0.4.4
          tar -czf ~/rpmbuild/SOURCES/libssc-0.4.4.tar.gz libssc-0.4.4/

          # iio-sensor-proxy (need parent dir for %autosetup)
          cd /tmp && mv iio-sensor-proxy iio-sensor-proxy-3.9
          tar -czf ~/rpmbuild/SOURCES/iio-sensor-proxy-3.9.tar.gz iio-sensor-proxy-3.9/

          # Copy special source files (Source1, Patch0, etc.)
          cp "$GITHUB_WORKSPACE/patches/adsprpcd-sensorspd.service" ~/rpmbuild/SOURCES/
          cp "$GITHUB_WORKSPACE/patches/wait_for_qmi_service.patch" ~/rpmbuild/SOURCES/

          echo "✓ Source tarballs created"
          ls -la ~/rpmbuild/SOURCES/

      - name: "Build RPMs"
        run: |
          set -e
          cd rpms

          # Build libssc FIRST - thp/keyboard-helper/iio-sensor-proxy need its headers
          echo "=== Building libssc ==="
          rpmbuild -ba libssc.spec --nodeps
          # Install libssc-devel so subsequent builds can find headers
          rpm -i --nodeps ~/rpmbuild/RPMS/aarch64/libssc-devel-*.rpm 2>/dev/null || \
            rpm -i --nodeps ~/rpmbuild/RPMS/noarch/libssc-devel-*.rpm 2>/dev/null || true

          echo "=== Building fastrpc ==="
          rpmbuild -ba fastrpc.spec --nodeps

          # Build thp and keyboard-helper (now have libssc headers)
          echo "=== Building xiaomi-sheng-thp ==="
          rpmbuild -ba xiaomi-sheng-thp.spec --nodeps

          echo "=== Building xiaomi-sheng-keyboard-helper ==="
          rpmbuild -ba xiaomi-sheng-keyboard-helper.spec --nodeps

          echo "=== Building iio-sensor-proxy ==="
          rpmbuild -ba iio-sensor-proxy.spec --nodeps

          echo "=== Building firmware-xiaomi-sheng ==="
          rpmbuild -ba firmware-xiaomi-sheng.spec --nodeps

          echo "=== Building sheng-devauth ==="
          rpmbuild -ba sheng-devauth.spec --nodeps

          echo "=== Building xiaomi-mipps-auth ==="
          rpmbuild -ba xiaomi-mipps-auth.spec --nodeps

          echo "=== Building xiaomi-charger-mode ==="
          rpmbuild -ba xiaomi-charger-mode.spec --nodeps

          echo "=== Building xiaomi-sheng-keyboard-backlight ==="
          rpmbuild -ba xiaomi-sheng-keyboard-backlight.spec --nodeps

          # xiaomi-pen-status: needs Qt6, skip for now
          # echo "=== Building xiaomi-pen-status ==="
          # rpmbuild -ba xiaomi-pen-status.spec --nodeps

          # xiaomi-sheng-fingerprint: complex build, skip for now
          # echo "=== Building xiaomi-sheng-fingerprint ==="
          # rpmbuild -ba xiaomi-sheng-fingerprint.spec --nodeps

          echo "=== Building sheng-sensors ==="
          rpmbuild -ba sheng-sensors.spec --nodeps

          echo "=== Building alsa-xiaomi-sheng ==="
          rpmbuild -ba alsa-xiaomi-sheng.spec --nodeps

          echo "✓ All RPMs built"
          ls -la ~/rpmbuild/RPMS/

      - name: "Upload RPM Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: custom-rpms
          path: /home/runner/rpmbuild/RPMS/**/*.rpm
          retention-days: 3
          if-no-files-found: warn

  # ==========================================================================
  # Build RootFS
  # ==========================================================================
  build-rootfs:
    name: "Build Fedora RootFS"
    runs-on: ubuntu-24.04-arm
    needs: [build-rpms]

    env:
      ROOTFS_MOUNT: /mnt/rootfs
      IMAGE_SIZE: 10G

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm tar xz e2fsprogs \
            qemu-user-static binfmt-support
          echo "✓ Build tools installed"

      - name: "Download RPM Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: custom-rpms
          path: rpms/

      - name: "Parse Partition Label"
        id: partition
        run: |
          case "${{ inputs.boot_mode }}" in
            'single (userdata)')
              echo "label=userdata" >> $GITHUB_OUTPUT
              echo "boot_img_pattern=boot_sheng_singleboot.img" >> $GITHUB_OUTPUT
              ;;
            'dual (linux)')
              echo "label=linux" >> $GITHUB_OUTPUT
              echo "boot_img_pattern=boot_sheng_dualboot.img" >> $GITHUB_OUTPUT
              ;;
            'custom')
              echo "label=${{ inputs.custom_partition }}" >> $GITHUB_OUTPUT
              echo "boot_img_pattern=boot.img" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "✓ Partition label set"

      - name: "Create RootFS Image"
        run: |
          truncate -s "$IMAGE_SIZE" rootfs.img
          mkfs.ext4 rootfs.img
          echo "✓ RootFS image created (${IMAGE_SIZE})"

      - name: "Mount RootFS Image"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT"
          sudo mount -o loop rootfs.img "$ROOTFS_MOUNT"
          echo "✓ RootFS image mounted at $ROOTFS_MOUNT"

      - name: "Install Fedora via DNF"
        run: |
          # Register binfmt for cross-architecture support
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true

          sudo dnf \
            --installroot="$ROOTFS_MOUNT" \
            --releasever="${{ inputs.fedora_version }}" \
            --repo=fedora \
            --repo=updates \
            --setopt=install_weak_deps=False \
            --setopt=tsflags=nodocs \
            install -y \
            @core \
            systemd systemd-sysv \
            sudo vim wget curl \
            NetworkManager openssh-server \
            wpa_supplicant dbus \
            ca-certificates \
            chrony \
            iw \
            lm-sensors \
            wireless-regdb \
            net-tools \
            glib2 \
            libqmi \
            libmbim \
            polkit
          echo "✓ DNF installroot complete"

      - name: "Mount Virtual File Systems"
        run: |
          sudo mount --bind /dev "$ROOTFS_MOUNT/dev"
          sudo mount --bind /dev/pts "$ROOTFS_MOUNT/dev/pts"
          sudo mount -t proc proc "$ROOTFS_MOUNT/proc"
          sudo mount -t sysfs sys "$ROOTFS_MOUNT/sys"
          sudo cp /etc/resolv.conf "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ Virtual file systems mounted"

      - name: "Install Custom RPMs"
        run: |
          sudo cp rpms/*.rpm "$ROOTFS_MOUNT/tmp/" 2>/dev/null || true
          sudo chroot "$ROOTFS_MOUNT" rpm -Uvh /tmp/*.rpm 2>/dev/null || true
          sudo rm -f "$ROOTFS_MOUNT/tmp/"*.rpm 2>/dev/null || true
          echo "✓ Custom RPMs installed"

      - name: "Versionlock Custom Packages"
        run: |
          # Prevent Fedora updates from overwriting our custom libssc/iio-sensor-proxy
          sudo chroot "$ROOTFS_MOUNT" dnf install -y python3-dnf-plugin-versionlock 2>/dev/null || true
          sudo chroot "$ROOTFS_MOUNT" dnf versionlock add libssc 2>/dev/null || true
          sudo chroot "$ROOTFS_MOUNT" dnf versionlock add iio-sensor-proxy 2>/dev/null || true
          echo "✓ Versionlock applied"

      - name: "Install Extra Packages"
        if: ${{ inputs.extra_packages != '' }}
        run: |
          EXTRA_PKGS="${{ inputs.extra_packages }}"
          echo "  Extra packages: $EXTRA_PKGS"
          sudo chroot "$ROOTFS_MOUNT" dnf install -y $EXTRA_PKGS
          echo "✓ Extra packages installed"

      - name: "Set Hostname"
        run: |
          echo "${{ inputs.hostname }}" | sudo tee "$ROOTFS_MOUNT/etc/hostname"
          if ! grep -q "127.0.1.1.*${{ inputs.hostname }}" "$ROOTFS_MOUNT/etc/hosts"; then
            echo "127.0.1.1 ${{ inputs.hostname }}" | sudo tee -a "$ROOTFS_MOUNT/etc/hosts"
          fi
          echo "✓ Hostname set to ${{ inputs.hostname }}"

      - name: "Configure Locale"
        run: |
          LANG_CHOICE="${{ inputs.language }}"

          if [ "$LANG_CHOICE" = 'None (C.UTF-8)' ]; then
            echo "✓ System locale stays C.UTF-8"
          else
            sudo chroot "$ROOTFS_MOUNT" dnf install -y glibc-langpack-en
            sudo chroot "$ROOTFS_MOUNT" localectl set-locale LANG="$LANG_CHOICE" 2>/dev/null || true
            echo "LANG=$LANG_CHOICE" | sudo tee "$ROOTFS_MOUNT/etc/locale.conf"
            echo "✓ Locale set to $LANG_CHOICE"
          fi

      - name: "Create User"
        run: |
          sudo chroot "$ROOTFS_MOUNT" useradd \
            -m -s /bin/bash \
            -G wheel \
            "${{ inputs.username }}"
          echo "✓ User ${{ inputs.username }} created"

      - name: "Set Passwords"
        env:
          ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [[ -z "$ROOTFS_PASSWORD" ]]; then
            ROOTFS_PASSWORD="password"
          else
            echo "::add-mask::$ROOTFS_PASSWORD"
          fi
          printf '%s:%s\n' "${{ inputs.username }}" "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          printf 'root:%s\n' "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          echo "✓ Passwords set"

      - name: "Enable Services"
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable NetworkManager
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sshd
          # QRTR服务 - Qualcomm IPC Router，传感器通信必需
          sudo chroot "$ROOTFS_MOUNT" systemctl enable qrtr-ns 2>/dev/null || {
            sudo mkdir -p "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service.d"
            echo "[Unit]" | sudo tee "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "Description=Qualcomm IPC Router Service (QRTR)" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "After=network.target" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "[Service]" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "ExecStart=/usr/bin/qrtr-ns -f" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "Restart=always" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "[Install]" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            echo "WantedBy=multi-user.target" | sudo tee -a "$ROOTFS_MOUNT/etc/systemd/system/qrtr-ns.service" > /dev/null
            sudo chroot "$ROOTFS_MOUNT" systemctl enable qrtr-ns 2>/dev/null || true
          }
          echo "✓ Services enabled"

      - name: "Configure sudo"
        run: |
          echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" | sudo tee "$ROOTFS_MOUNT/etc/sudoers.d/wheel"
          sudo chmod 440 "$ROOTFS_MOUNT/etc/sudoers.d/wheel"
          echo "✓ sudo configured for wheel group"

      - name: "Disable SELinux"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT/etc/selinux"
          echo "SELINUX=disabled" | sudo tee "$ROOTFS_MOUNT/etc/selinux/config"
          echo "SELINUXTYPE=targeted" | sudo tee -a "$ROOTFS_MOUNT/etc/selinux/config"
          echo "✓ SELinux disabled"

      - name: "Configure fstab"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          echo "PARTLABEL=$PARTITION / ext4 defaults,x-systemd.growfs 0 1" | \
            sudo tee "$ROOTFS_MOUNT/etc/fstab"
          echo "✓ fstab configured: root=PARTLABEL=$PARTITION"

      - name: "Clean DNF Cache"
        run: |
          sudo chroot "$ROOTFS_MOUNT" dnf clean all
          sudo rm -rf "$ROOTFS_MOUNT/var/cache/dnf"
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ DNF cache cleaned"

      - name: "Unmount Virtual File Systems"
        if: always()
        run: |
          sudo umount "$ROOTFS_MOUNT/dev/pts" 2>/dev/null || true
          sudo umount "$ROOTFS_MOUNT/dev" 2>/dev/null || true
          sudo umount "$ROOTFS_MOUNT/proc" 2>/dev/null || true
          sudo umount "$ROOTFS_MOUNT/sys" 2>/dev/null || true
          echo "✓ Virtual file systems unmounted"

      - name: "Unmount Image & Set UUID"
        run: |
          sudo umount "$ROOTFS_MOUNT" 2>/dev/null || true
          tune2fs -U random rootfs.img || true
          echo "✓ Image unmounted, UUID set"

      - name: "Generate boot.img"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          CMDLINE="root=PARTLABEL=$PARTITION"
          chmod +x mkbootimg
          ./mkbootimg \
            --kernel Image.gz-dtb_sheng \
            --cmdline "$CMDLINE" \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --tags_offset 0x01e00000 \
            --pagesize 4096 \
            --id \
            -o boot.img
          echo "✓ boot.img generated (cmdline: $CMDLINE)"

      - name: "Upload RootFS Image"
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-fedora-${{ inputs.fedora_version }}-${{ steps.partition.outputs.label }}
          path: rootfs.img
          retention-days: 14
          if-no-files-found: error
          compression-level: 1

      - name: "Upload Boot Image"
        uses: actions/upload-artifact@v7
        with:
          name: boot-fedora-${{ inputs.fedora_version }}-${{ steps.partition.outputs.label }}
          path: boot.img
          retention-days: 14
          if-no-files-found: warn
          compression-level: 1
